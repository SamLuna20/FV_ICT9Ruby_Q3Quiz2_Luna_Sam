<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<title>Q3Quiz2</title>

	<style>
/*	design for whole page	*/
		body{
			background-image: url("weeknd.jpg");
			background-size: cover !important;
			background-repeat: no-repeat;
			width: 100% !important;
			margin-top: 20px;
			margin-bottom: 20px;
		}
/*  design for title  */
		h1{
			text-align: center;
			font-family: inherit;
			background-color: darkgrey;
			color: black;
		}
/*  image size  */
		img{
			
			width: 500px;
			height: 200px;
		}

		div{
			margin-left: 20px;
			margin-right: 20px;
			color: whitesmoke;
		}
	</style>
</head>
<body>
	<h1>- - - - <strong>The Weeknd</strong> (Asia's Tour Tickets) - - - -</h1>
	<div>
	<br>
<!-- Personal Information Section -->
		<details>
			<summary style="text-align: center; background-color: black; color: darkgrey; font-size: 20px;">Personal Information</summary>
			<form>
				<label for="name">Enter Name:</label>
					<input type="text" id="name" class="form-control">
				<label for="email">Enter Email:</label>
					<input type="text" id="email" class="form-control">
				<br>
				<button class="btn btn-dark" onclick="received1(event)">Return Personal Info</button>
			</form>
		</details>
	<br><br>
<!-- View Ticket Price Section -->
		<details>
			<summary style="text-align: center; background-color: black; color: darkgrey; font-size: 20px;">View Ticket Price</summary>
			<i id="show"></i>
			<br>
			<form>
				<select class="form-select" id="place">
					<option value="none">Choose your Seat</option>
					<option value="2000">Upper Box</option>
					<option value="5000">Lower Box</option>
					<option value="8000">VIP</option>
				</select>
			<br><br>
				<select class="form-select" id="type">
					<option value="none">Choose an Option</option>
					<option value="0">Regular</option>
					<option value="0.20">PWD</option>
					<option value="0.20">Student</option>
					<option value="0.20">Senior</option>
				</select>	
				<br>
				<button class="btn btn-dark" onclick="price(event)">View Ticket Price</button>
			</form>
		</details>
	<br><br>
<!-- Print Ticket Section -->
	<details>
			<summary style="text-align: center; background-color: black; color: darkgrey; font-size: 20px;">Print Ticket</summary>
		<br>
		<center>
			<img src="https://i.pinimg.com/736x/bd/36/e9/bd36e98a907fa554da75f6d62e6e17c1.jpg">
			<button class="btn btn-dark" onclick="ticket(event)">Print Ticket</button>
		</center>
	<br>
		<center>
			<button>
				<a class="btn btn-light" href="index.html">
					Buy more tickets
				</a>
			</button>
		</center>
	</div>
	<script>

	// function to call when you click "Return Personal Info"
		function received1(){
			event.preventDefault();
			var name= document.getElementById("name").value;
			window.alert("Thank you for answering, " + name);
		}
	// function to call when "View Ticket Price" is clicked
		 function price(){
		 	event.preventDefault();
			var seat = Number(document.getElementById("place").value);
			var type = Number(document.getElementById("type").value);
			var price = seat - (seat * type);
			window.alert("Please pay ₱" + price + ". Thank you for your purchase!");
		}
	// function for printing ticket when you click "Print Ticket"
		function ticket(){
			event.preventDefault();
			window.alert("Please check your email for the ticket. Thank you!");
		}

	</script>
</body>
</html>
